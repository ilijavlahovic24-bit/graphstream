[package]
name = "visualization"
version = "0.1.0"
edition = "2021"

[dependencies]
temporal_graph = { path = "../temporal_graph" }
sharding = { path = "../sharding" }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "time", "io-util", "net", "sync"] }
tracing = "0.1"
anyhow = "1"