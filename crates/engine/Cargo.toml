[package]
name = "engine"
version = "0.1.0"
edition = "2021"

[dependencies]
temporal_graph = { path = "../temporal_graph" }
query = { path = "../query" }
tql_parser = { path = "../tql_parser" }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "net", "io-util", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rustyline = "14"
clap = { version = "4", features = ["derive"] }

[[bin]]
name = "graphstream"
path = "src/bin/graphstream.rs"

[dev-dependencies]
chrono = "0.4"
serde_json = "1"