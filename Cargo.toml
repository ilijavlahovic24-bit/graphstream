[workspace]
members = [
    "crates/engine",
    "crates/interval",
    "crates/temporal_graph",
    "crates/tql_parser",
    "crates/visualization"
]
resolver = "2"
[workspace.dependencies]
tokio     = { version = "1", features = ["full"] }
clap = { version = "4.6.1", features = ["derive"] }
tracing = "0.1.44"
anyhow = "1.0.104"
tracing-subscriber = "0.3.23"
