apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-adapter-config
  namespace: monitoring
data:
  config.yaml: |
    rules:
      # Ingest rate: events per second, averaged over 1m, per shard pod.
      - seriesQuery: 'graphstream_shard_events_ingested_total{namespace!="",pod!=""}'
        resources:
          overrides:
            namespace: { resource: "namespace" }
            pod:       { resource: "pod" }
        name:
          matches: "^graphstream_shard_events_ingested_total$"
          as: "graphstream_ingest_rate"
        metricsQuery: |
          sum(rate(<<.Series>>{<<.LabelMatchers>>}[1m])) by (<<.GroupBy>>)

      # Query p99 latency across all shards.
      - seriesQuery: 'graphstream_query_duration_seconds_bucket{namespace!="",pod!=""}'
        resources:
          overrides:
            namespace: { resource: "namespace" }
            pod:       { resource: "pod" }
        name:
          matches: "^graphstream_query_duration_seconds$"
          as: "graphstream_query_latency_p99"
        metricsQuery: |
          histogram_quantile(0.99,
            sum(rate(<<.Series>>_bucket{<<.LabelMatchers>>}[5m])) by (le, <<.GroupBy>>)
          )