apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: graphstream-shards-minimal
  namespace: graphstream-clusters
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: StatefulSet
    name: minimal
  minReplicas: 2
  maxReplicas: 32
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
        - type: Pods
          value: 4
          periodSeconds: 30
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 25
          periodSeconds: 60
      selectPolicy: Max
  metrics:
    - type: Pods
      pods:
        metric:
          name: graphstream_ingest_rate
        target:
          type: AverageValue
          averageValue: 5000
    - type: Pods
      pods:
        metric:
          name: graphstream_query_latency_p99
        target:
          type: AverageValue
          averageValue: 250m