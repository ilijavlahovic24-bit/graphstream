apiVersion: apps/v1
kind: Deployment
metadata:
  name: graphstream-operator
  namespace: graphstream-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: graphstream-operator
  template:
    metadata:
      labels:
        app: graphstream-operator
    spec:
      serviceAccountName: graphstream-operator
      containers:
        - name: operator
          image: graphstream/operator:latest
          env:
            - name: RUST_LOG
              value: "info,kube=warn"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 5
---
apiVersion: v1
kind: Namespace
metadata:
  name: graphstream-system