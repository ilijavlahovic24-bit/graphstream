apiVersion: graphstream.io/v1alpha1
kind: GraphStreamCluster
metadata:
  name: demo
  namespace: default
spec:
  shards: 4
  replicationFactor: 2
  memoryLimitMb: 1024
  cpuRequestMillicores: 500
  shardWindowSeconds: 3600
  allowedLatenessMs: 30000
  image: graphstream/shard:latest
  kafka:
    brokers: "kafka.kafka-system.svc:9092"
    topic: "graphstream.events"
    groupId: "gs-demo"