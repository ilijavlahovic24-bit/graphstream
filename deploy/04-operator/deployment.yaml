apiVersion: apps/v1
kind: Deployment
metadata:
  name: graphstream-operator
  namespace: graphstream-system
  labels:
    app.kubernetes.io/name: graphstream-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: graphstream-operator
  strategy:
    type: Recreate   # single-leader semantics: never two operators at once
  template:
    metadata:
      labels:
        app.kubernetes.io/name: graphstream-operator
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8081"
    spec:
      serviceAccountName: graphstream-operator
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
      containers:
        - name: operator
          image: graphstream/operator:0.1.0
          imagePullPolicy: IfNotPresent
          env:
            - name: RUST_LOG
              value: "info,kube_runtime=warn,kube_client=warn"
            - name: RUST_BACKTRACE
              value: "1"
            - name: WATCH_NAMESPACE
              value: ""   # empty = all namespaces
            - name: OPERATOR_METRICS_ADDR
              value: "0.0.0.0:8081"
          ports:
            - name: health
              containerPort: 8080
            - name: metrics
              containerPort: 8081
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
      terminationGracePeriodSeconds: 30