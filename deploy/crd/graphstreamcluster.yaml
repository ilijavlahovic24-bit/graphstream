apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: graphstreamclusters.graphstream.io
spec:
  group: graphstream.io
  scope: Namespaced
  names:
    plural: graphstreamclusters
    singular: graphstreamcluster
    kind: GraphStreamCluster
    shortNames:
      - gsc
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [shards, shardWindowSeconds, kafka]
              properties:
                shards:
                  type: integer
                  minimum: 1
                  maximum: 256
                replicationFactor:
                  type: integer
                  minimum: 1
                  maximum: 5
                  default: 1
                memoryLimitMb:
                  type: integer
                  minimum: 128
                  default: 1024
                cpuRequestMillicores:
                  type: integer
                  default: 500
                shardWindowSeconds:
                  type: integer
                  minimum: 1
                allowedLatenessMs:
                  type: integer
                  default: 5000
                image:
                  type: string
                  default: graphstream/shard:latest
                kafka:
                  type: object
                  required: [brokers, topic, groupId]
                  properties:
                    brokers: { type: string }
                    topic: { type: string }
                    groupId: { type: string }
                    credentialsSecret: { type: string }
            status:
              type: object
              properties:
                observedGeneration: { type: integer }
                readyReplicas: { type: integer }
                phase: { type: string, enum: [Pending, Progressing, Ready, Failed] }
                message: { type: string }
                conditions:
                  type: array
                  items:
                    type: object
                    required: [type, status, reason, message]
                    properties:
                      type: { type: string }
                      status: { type: string }
                      reason: { type: string }
                      message: { type: string }
                      lastTransitionTime: { type: string }